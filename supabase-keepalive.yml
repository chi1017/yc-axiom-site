# 每週兩次呼叫 Supabase 一個極輕量的函式，避免免費方案因 7 天閒置而暫停專案。
# 網址與金鑰直接讀 assets/supabase-config.js（本來就是公開值），不需要在 GitHub 設定任何 secrets。
# 注意：公開 repo 若連續 60 天沒有任何提交，GitHub 會自動停用排程；網站有更新時就會重新計算。
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * 1,4'   # 週一、週四 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(grep -oP "supabaseUrl:\s*'\K[^']+" assets/supabase-config.js || true)
          key=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" assets/supabase-config.js || true)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "supabase-config.js 尚未填入，略過"; exit 0; fi
          hdr=(-H "apikey: $key")
          case "$key" in sb_publishable_*) ;; *) hdr+=(-H "Authorization: Bearer $key");; esac
          code=$(curl -sS -o resp.txt -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 \
            -X POST "$url/rest/v1/rpc/keepalive" "${hdr[@]}" -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; cat resp.txt; echo
          test "$code" = "200"
